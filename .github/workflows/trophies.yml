name: Generate GitHub Trophies

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate GitHub Profile Trophy
        uses: ryo-ma/github-profile-trophy@v1
        with:
          username: vishnurj06
          output_path: dist/github-trophies.svg

      - name: Push trophies to gh-pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
